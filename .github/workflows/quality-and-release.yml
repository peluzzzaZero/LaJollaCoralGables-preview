name: Quality and versioned release

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require a new semantic version before merging to main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          node scripts/check-version.mjs "$BASE_SHA"
      - name: Brand, content and release checks
        run: |
          node --check script.js
          node --test tests/*.test.mjs
          git diff --check
      - name: Install browser review dependencies
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium ffmpeg
      - name: Responsive, accessibility and simulated form review
        run: python tests/browser/review.py --output review-artifacts
      - name: Save screenshots, recordings and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review-${{ github.sha }}
          path: review-artifacts
          retention-days: 14

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          test -s "tests/releases/$tag.md"
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" -m "La Jolla $tag — reviewed release" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "La Jolla $tag" --notes-file "tests/releases/$tag.md"
          fi
