name: Quality and versioned release

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: FAKE-ISOLATED-TEST-PASSWORD
          MYSQL_DATABASE: lajolla_test
        ports:
          - 13316:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require a new semantic version before merging to main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          node scripts/check-version.mjs "$BASE_SHA"
      - name: Brand, content and release checks
        run: |
          node --check script.js
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          MAIL_MYSQL_TEST=true npm test
          git diff --check
      - name: Install browser review dependencies
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium ffmpeg
      - name: Responsive, accessibility and simulated form review
        run: python tests/browser/review.py --output review-artifacts
      - name: Native Node forms with intercepted delivery only
        run: |
          INQUIRY_ENABLED=false MAIL_SETUP_ENABLED=false PORT=13317 HOST=127.0.0.1 npm start > /tmp/lajolla-node-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:13317/healthz', timeout=1)
                  break
              except Exception:
                  time.sleep(.2)
          else:
              raise RuntimeError('Node preview did not start')
          PY
          python tests/browser/native-forms.py --base http://127.0.0.1:13317 --output review-artifacts/native
      - name: Save screenshots, recordings and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review-${{ github.sha }}
          path: review-artifacts
          retention-days: 14

  review-v14:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install retrospective review dependencies
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium ffmpeg
      - name: Verify immutable v1.4.0 before restoring its missing tag
        run: python scripts/review-v14.py --output v14-review-artifacts
      - name: Save retrospective review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v14-retrospective-${{ github.sha }}
          path: v14-review-artifacts
          retention-days: 14

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [review, review-v14]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Restore the missing annotated v1.4.0 tag only after its exact product tree passes review.
          previous_tag="v1.4.0"
          previous_commit="ae36e702289cb12b6d2222a2ea1703bc1422c4e5"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git rev-parse "refs/tags/$previous_tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$previous_tag")" = "$previous_commit"
          else
            git tag -a "$previous_tag" -m "La Jolla $previous_tag — retrospective exact-tree review" "$previous_commit"
            git push origin "refs/tags/$previous_tag"
          fi
          if ! gh release view "$previous_tag" >/dev/null 2>&1; then
            gh release create "$previous_tag" --verify-tag --title "La Jolla $previous_tag" --notes-file "tests/releases/$previous_tag.md"
          fi
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          test -s "tests/releases/$tag.md"
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" -m "La Jolla $tag — reviewed release" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "La Jolla $tag" --notes-file "tests/releases/$tag.md"
          fi
