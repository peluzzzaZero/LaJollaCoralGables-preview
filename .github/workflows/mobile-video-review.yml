name: Mobile video review
on:
  pull_request:
    branches: [dev, main]
    paths:
      - script.js
      - tests/browser/motion-quality.py
      - .github/workflows/mobile-video-review.yml
permissions:
  contents: read
concurrency:
  group: mobile-video-${{ github.ref }}
  cancel-in-progress: true
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium webkit ffmpeg
      - run: python tests/browser/motion-quality.py --webkit-only --output mobile-video-artifacts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-video-${{ github.sha }}
          path: mobile-video-artifacts
          retention-days: 14
